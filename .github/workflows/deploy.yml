name: Deploy

# CI 워크플로가 Docker Hub 업로드까지 성공으로 끝나면,
# 집에 있는 macOS self-hosted runner 에서 로컬 컨테이너를 새 이미지로 교체한다.
#
# 러너 환경: macOS 27 (Apple Silicon / arm64), Docker Desktop, LaunchAgent 서비스로 상주
# CI 가 올리는 이미지는 linux/amd64 이므로 Rosetta 에뮬레이션으로 실행한다.
on:
  workflow_run:
    workflows: ["CI"]          # CI 워크플로의 name: 과 정확히 일치해야 한다
    types: [completed]
  # 이미지 변경 없이 배포만 다시 시도하고 싶을 때 수동 실행
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 이미지 태그 (비우면 latest)'
        required: false
        default: ''

# 같은 머신의 컨테이너를 교체하므로 배포는 항상 한 번에 하나만 실행한다.
concurrency:
  group: deploy-local
  cancel-in-progress: false

jobs:
  deploy:
    name: 로컬 컨테이너 교체
    # workflow_run 은 CI 가 "성공"으로 끝난 경우에만 진행한다.
    # PR 로 돌아간 CI 는 Docker Hub 에 업로드하지 않으므로 배포 대상이 아니다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    env:
      CONTAINER_NAME: cat-breed-estimator
      HOST_PORT: '8000'
      # CI 는 linux/amd64 단일 플랫폼으로 올린다. Apple Silicon 에서는 에뮬레이션이 필요하다.
      PLATFORM: linux/amd64
      # 모델 로드(341MB) + amd64 에뮬레이션을 감안한 상한. 준비되면 즉시 넘어간다.
      HEALTH_TIMEOUT_SEC: '720'

    steps:
      # LaunchAgent(svc.sh)로 띄운 러너는 PATH 가 최소값일 수 있어 docker 를 찾지 못한다.
      - name: PATH 보정 및 Docker 준비 확인
        run: |
          set -euo pipefail
          for d in /usr/local/bin /opt/homebrew/bin /Applications/Docker.app/Contents/Resources/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          export PATH="/usr/local/bin:/opt/homebrew/bin:/Applications/Docker.app/Contents/Resources/bin:$PATH"

          command -v docker >/dev/null || { echo "::error::docker CLI 를 찾을 수 없습니다."; exit 1; }

          # Docker Desktop 이 꺼져 있으면 띄우고 데몬이 응답할 때까지 기다린다.
          if ! docker info >/dev/null 2>&1; then
            echo "Docker 데몬이 응답하지 않습니다. Docker Desktop 을 시작합니다."
            open -ga Docker || true
            for i in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then break; fi
              sleep 5
            done
          fi
          docker info >/dev/null 2>&1 || { echo "::error::Docker 데몬을 사용할 수 없습니다."; exit 1; }

          echo "docker: $(command -v docker)"
          docker version --format 'client {{.Client.Version}} / server {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'

          # 다음 단계에서 DOCKER_CONFIG 를 작업 전용 디렉터리로 바꾸면 context 설정이
          # 함께 사라져 데몬 주소를 잃는다. 지금 쓰는 소켓을 먼저 읽어 고정해 둔다.
          host="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)"
          if [ -n "$host" ]; then
            echo "DOCKER_HOST=$host" >> "$GITHUB_ENV"
            echo "DOCKER_HOST=$host 로 고정"
          fi

      # macOS 키체인 우회 — 이 단계가 없으면 docker/login-action 이 아래 오류로 실패한다.
      #   error saving credentials - err: exit status 1,
      #   out: `User interaction is not allowed. (-25308)`
      # 기본 설정(~/.docker/config.json)은 credsStore=desktop 이라 로그인 성공 후
      # 자격 증명을 macOS 키체인에 저장하려 하는데, LaunchAgent 로 상주하는 러너에는
      # GUI 세션이 없어 키체인에 쓸 수 없다.
      - name: Docker 자격 증명 저장소 준비
        run: |
          set -euo pipefail
          cfg="${{ runner.temp }}/docker-config"
          rm -rf "$cfg"
          mkdir -p "$cfg"
          chmod 700 "$cfg"
          # credsStore 를 지정하지 않은 빈 설정 — 자격 증명은 이 디렉터리 안에만 남고,
          # 작업이 끝나면 docker/login-action 의 post 단계(docker logout)가 지운다.
          printf '{}' > "$cfg/config.json"
          chmod 600 "$cfg/config.json"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"

          DOCKER_CONFIG="$cfg" docker info --format '데몬 확인 OK — {{.ServerVersion}} ({{.OSType}}/{{.Architecture}})'

      - name: 배포 대상 결정
        id: target
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          # CI 와 동일한 규칙: 공백 제거 + 소문자. 시크릿 값 자체는 출력하지 않는다.
          user="$(printf '%s' "${DOCKERHUB_USERNAME}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$user" ]; then
            echo "::error::DOCKERHUB_USERNAME 시크릿이 없어 이미지를 내려받을 수 없습니다."
            exit 1
          fi
          repo="${user}/cat-breed-estimator"

          # 태그 우선순위: 수동 입력 > CI 커밋의 sha 태그(docker/metadata-action 의 type=sha) > latest
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          elif [ -n "${HEAD_SHA}" ]; then
            tag="sha-$(printf '%s' "${HEAD_SHA}" | cut -c1-7)"
          else
            tag="latest"
          fi

          echo "repo=${repo}"         >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${tag}" >> "$GITHUB_OUTPUT"
          echo "배포 대상: ${repo}:${tag}"

      # 기존 CI 와 동일한 방식으로 로그인한다.
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 롤백용 현재 이미지 기록
        id: prev
        run: |
          set -euo pipefail
          prev=""
          if docker inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
            prev="$(docker inspect -f '{{.Image}}' "${CONTAINER_NAME}")"
            echo "현재 컨테이너가 쓰는 이미지: ${prev}"
          else
            echo "실행 중인 ${CONTAINER_NAME} 컨테이너가 없습니다. (첫 배포)"
          fi
          echo "image_id=${prev}" >> "$GITHUB_OUTPUT"

      - name: 이미지 내려받기
        run: |
          set -euo pipefail
          IMAGE='${{ steps.target.outputs.image }}'
          LATEST='${{ steps.target.outputs.repo }}:latest'

          if docker pull --platform "${PLATFORM}" "$IMAGE"; then
            echo "내려받음: $IMAGE"
          else
            echo "::warning::${IMAGE} 를 내려받지 못했습니다. ${LATEST} 로 대체합니다."
            docker pull --platform "${PLATFORM}" "$LATEST"
            echo "IMAGE_OVERRIDE=$LATEST" >> "$GITHUB_ENV"
          fi

      - name: 컨테이너 교체
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_OVERRIDE:-${{ steps.target.outputs.image }}}"
          # 이 변수가 설정됐다는 것은 "이 실행이 컨테이너를 건드렸다"는 표시이기도 하다.
          # 아래 실패 처리 단계는 이 값이 있을 때만 동작한다.
          echo "IMAGE_DEPLOYED=$IMAGE" >> "$GITHUB_ENV"

          # 같은 포트를 쓰는 다른 컨테이너가 남아 있으면 교체가 실패하므로 함께 정리한다.
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          others="$(docker ps -q --filter "publish=${HOST_PORT}")"
          if [ -n "$others" ]; then
            echo "::warning::${HOST_PORT} 포트를 쓰는 다른 컨테이너를 정리합니다: $others"
            docker rm -f $others || true
          fi

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --platform "${PLATFORM}" \
            --restart unless-stopped \
            -p "${HOST_PORT}:8000" \
            "$IMAGE"

          docker ps --filter "name=${CONTAINER_NAME}" \
            --format '{{.Names}}  {{.Image}}  {{.Status}}  {{.Ports}}'

      - name: 서비스 기동 대기 및 검증
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:${HOST_PORT}"
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SEC ))
          started=$(date +%s)

          echo "::group::헬스 체크 대기 (${BASE}/api/health)"
          ready=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! docker ps -q --filter "name=${CONTAINER_NAME}" --filter "status=running" | grep -q .; then
              echo "::error::컨테이너가 종료되었습니다."
              break
            fi
            if curl -fsS "${BASE}/api/health" 2>/dev/null | grep -q '"ready": *true'; then
              ready=1; break
            fi
            sleep 3
          done
          echo "::endgroup::"

          if [ "$ready" -ne 1 ]; then
            echo "::error::${HEALTH_TIMEOUT_SEC}초 안에 서비스가 준비되지 않았습니다."
            exit 1
          fi
          echo "health OK ($(( $(date +%s) - started ))초 만에 준비)"

          echo "::group::서비스 응답 검증"
          count=$(curl -fsS "${BASE}/api/breeds" | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          echo "라벨 수: $count"
          [ "$count" = "48" ] || { echo "::error::라벨 수가 48이 아닙니다: $count"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/")
          echo "UI 응답 코드: $code"
          [ "$code" = "200" ] || { echo "::error::UI 기대 200, 실제 $code"; exit 1; }

          # 컨테이너 안에서 실제로 어떤 아키텍처/사용자로 돌고 있는지 남겨 둔다.
          echo "컨테이너 아키텍처: $(docker exec "${CONTAINER_NAME}" uname -m)"
          echo "실행 사용자: $(docker exec "${CONTAINER_NAME}" id -un)"
          echo "::endgroup::"

      # IMAGE_DEPLOYED 가 비어 있으면 교체 단계 전에 실패한 것이므로
      # 돌고 있는 컨테이너에 손대지 않는다. (예: 로그인 실패)
      - name: 실패 시 로그 수집 및 롤백
        if: failure() && env.IMAGE_DEPLOYED != ''
        env:
          PREV_IMAGE: ${{ steps.prev.outputs.image_id }}
        run: |
          set +e
          echo "::group::컨테이너 로그 (마지막 200줄)"
          docker logs --tail 200 "${CONTAINER_NAME}" 2>&1
          echo "::endgroup::"
          echo "::group::컨테이너 상태"
          docker inspect -f 'State={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' "${CONTAINER_NAME}" 2>&1
          echo "::endgroup::"

          if [ -n "${PREV_IMAGE}" ]; then
            echo "이전 이미지(${PREV_IMAGE})로 롤백합니다."
            docker rm -f "${CONTAINER_NAME}"
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --platform "${PLATFORM}" \
              --restart unless-stopped \
              -p "${HOST_PORT}:8000" \
              "${PREV_IMAGE}"
            docker ps --filter "name=${CONTAINER_NAME}" --format '롤백 후: {{.Image}}  {{.Status}}'
          else
            echo "롤백할 이전 이미지가 없습니다. 실패한 컨테이너를 정리합니다."
            docker rm -f "${CONTAINER_NAME}"
          fi

      - name: 이미지 정리 및 현황
        if: success()
        run: |
          set -euo pipefail
          repo='${{ steps.target.outputs.repo }}'
          # 교체로 참조가 끊긴 이 저장소의 태그 없는 이미지만 지운다.
          # (docker image prune 은 다른 프로젝트의 이미지까지 건드리므로 쓰지 않는다)
          dangling="$(docker images "$repo" --filter dangling=true -q | sort -u)"
          if [ -n "$dangling" ]; then
            echo "태그 없는 이전 이미지 정리: $dangling"
            docker rmi $dangling || true
          fi
          docker images "$repo" --format '{{.Repository}}:{{.Tag}}  {{.Size}}' || true

      - name: 배포 결과 요약
        if: success()
        run: |
          {
            echo "### 로컬 배포 완료"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 이미지 | \`${IMAGE_DEPLOYED}\` |"
            echo "| 컨테이너 | \`${CONTAINER_NAME}\` |"
            echo "| 플랫폼 | \`${PLATFORM}\` (Apple Silicon 에뮬레이션) |"
            echo "| 접속 주소 | http://localhost:${HOST_PORT} |"
            echo ""
            echo "재시작 정책이 \`unless-stopped\` 이므로 Docker Desktop 재시작 후에도 자동으로 올라옵니다."
          } >> "$GITHUB_STEP_SUMMARY"
