name: Deploy

# CI 워크플로가 Docker Hub 업로드까지 성공으로 끝나면,
# macOS self-hosted runner 에서 로컬 컨테이너를 새 이미지로 교체한다.
#
# 서비스 변경을 시작하기 전에 독립된 모니터링 프로세스를 띄워, 고정 테스트 이미지로
# 실제 분석 API 를 1초 간격으로 계속 호출한다. 배포 전·중·후(완료 뒤 30초)를 모두 관측하고
# 결과를 Actions 로그 / Step Summary / Artifacts 로 남긴다.
#
# 러너 환경: macOS 27 (Apple Silicon / arm64), Docker Desktop, LaunchAgent 서비스로 상주
# CI 가 올리는 이미지는 linux/amd64 이므로 Rosetta 에뮬레이션으로 실행한다.
on:
  workflow_run:
    workflows: ["CI"]          # CI 워크플로의 name: 과 정확히 일치해야 한다
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 이미지 태그 (비우면 latest)'
        required: false
        default: ''

concurrency:
  group: deploy-local
  cancel-in-progress: false

jobs:
  deploy:
    name: 로컬 컨테이너 교체 · 무중단 검증
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45

    env:
      CONTAINER_NAME: cat-breed-estimator
      PROXY_NAME: cat-breed-proxy
      DOCKER_NET: catbreed-net
      HOST_PORT: '8000'
      PLATFORM: linux/amd64
      HEALTH_TIMEOUT_SEC: '720'
      POST_DEPLOY_WATCH_SEC: '30'     # 배포 완료 후 계속 관측할 시간
      MONITOR_INTERVAL_SEC: '1.0'     # 응답 완료 후 다음 요청까지 대기
      LOGDIR: monitor-logs            # 워크스페이스 기준 (.gitignore 처리됨)

    steps:
      # 모니터링 스크립트를 쓰기 위해 배포 대상 커밋을 그대로 체크아웃한다.
      - name: 소스 체크아웃 (배포 대상 커밋)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: PATH 보정 및 Docker 준비 확인
        run: |
          set -euo pipefail
          for d in /usr/local/bin /opt/homebrew/bin /Applications/Docker.app/Contents/Resources/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          export PATH="/usr/local/bin:/opt/homebrew/bin:/Applications/Docker.app/Contents/Resources/bin:$PATH"

          command -v docker >/dev/null || { echo "::error::docker CLI 를 찾을 수 없습니다."; exit 1; }

          if ! docker info >/dev/null 2>&1; then
            echo "Docker 데몬이 응답하지 않습니다. Docker Desktop 을 시작합니다."
            open -ga Docker || true
            for i in $(seq 1 60); do
              if docker info >/dev/null 2>&1; then break; fi
              sleep 5
            done
          fi
          docker info >/dev/null 2>&1 || { echo "::error::Docker 데몬을 사용할 수 없습니다."; exit 1; }

          docker version --format 'client {{.Client.Version}} / server {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'

          # 다음 단계에서 DOCKER_CONFIG 를 바꾸면 context 설정이 사라지므로 소켓을 먼저 고정한다.
          host="$(docker context inspect --format '{{.Endpoints.docker.Host}}' 2>/dev/null || true)"
          if [ -n "$host" ]; then
            echo "DOCKER_HOST=$host" >> "$GITHUB_ENV"
          fi

      # macOS 키체인 우회. 빈 '{}' 설정은 오히려 Docker CLI 가 osxkeychain 을 자동 탐지해
      # credsStore 에 써넣게 만든다. auths 를 미리 하나 넣어 두면 파일 저장소를 유지한다.
      - name: Docker 자격 증명 저장소 준비
        run: |
          set -euo pipefail
          cfg="${{ runner.temp }}/docker-config"
          rm -rf "$cfg"; mkdir -p "$cfg"; chmod 700 "$cfg"
          printf '{"auths":{"https://index.docker.io/v1/":{}}}' > "$cfg/config.json"
          chmod 600 "$cfg/config.json"
          echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$cfg" docker info --format '데몬 확인 OK — {{.ServerVersion}} ({{.OSType}}/{{.Architecture}})'

      - name: 배포 대상 결정
        id: target
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          user="$(printf '%s' "${DOCKERHUB_USERNAME}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$user" ]; then
            echo "::error::DOCKERHUB_USERNAME 시크릿이 없어 이미지를 내려받을 수 없습니다."
            exit 1
          fi
          repo="${user}/cat-breed-estimator"
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          elif [ -n "${HEAD_SHA}" ]; then
            tag="sha-$(printf '%s' "${HEAD_SHA}" | cut -c1-7)"
          else
            tag="latest"
          fi
          echo "repo=${repo}"         >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "image=${repo}:${tag}" >> "$GITHUB_OUTPUT"
          echo "배포 대상: ${repo}:${tag}"

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 자격 증명 저장 위치 확인
        run: |
          set -euo pipefail
          if grep -q '"credsStore"' "${DOCKER_CONFIG}/config.json"; then
            echo "::error::credsStore 가 설정되었습니다 — 키체인 경로로 되돌아갔습니다."
            exit 1
          fi
          if ! grep -q '"auth"' "${DOCKER_CONFIG}/config.json"; then
            echo "::error::자격 증명이 ${DOCKER_CONFIG}/config.json 에 저장되지 않았습니다."
            exit 1
          fi
          echo "자격 증명 저장 위치: ${DOCKER_CONFIG}/config.json (키체인 미사용)"

      # ─────────── 여기서부터 서비스 변경 전. 모니터를 먼저 띄운다. ───────────
      - name: 모니터링 프로세스 시작 (서비스 변경 전)
        run: |
          set -euo pipefail
          rm -rf "${LOGDIR}"; mkdir -p "${LOGDIR}"
          /usr/bin/python3 scripts/probe_image.py "${LOGDIR}/probe.png"
          printf 'before' > "${LOGDIR}/phase"

          # 배포 단계와 분리된 프로세스로 띄운다. 이후 모든 단계가 도는 동안 계속 살아 있다.
          nohup /usr/bin/python3 scripts/deploy_monitor.py \
            --url "http://127.0.0.1:${HOST_PORT}" \
            --image "${LOGDIR}/probe.png" \
            --out "${LOGDIR}/monitor.jsonl" \
            --phase-file "${LOGDIR}/phase" \
            --stop-file "${LOGDIR}/stop" \
            --interval "${MONITOR_INTERVAL_SEC}" \
            > "${LOGDIR}/monitor.out" 2>&1 &
          echo $! > "${LOGDIR}/monitor.pid"
          disown || true
          sleep 2
          kill -0 "$(cat "${LOGDIR}/monitor.pid")" 2>/dev/null \
            && echo "모니터 PID $(cat "${LOGDIR}/monitor.pid") 기동" \
            || { echo "::error::모니터 기동 실패"; cat "${LOGDIR}/monitor.out"; exit 1; }

      - name: 배포 전 정상 응답 확인
        run: |
          set -euo pipefail
          LOG="${LOGDIR}/monitor.jsonl"
          running=0
          docker ps -q --filter "name=${CONTAINER_NAME}" --filter "status=running" | grep -q . && running=1 || true

          ok=0
          for i in $(seq 1 30); do
            ok=$(grep -c '"analysis_ok": true' "$LOG" 2>/dev/null || true)
            ok=${ok:-0}
            [ "$ok" -ge 3 ] && break
            sleep 2
          done

          if [ "$ok" -ge 3 ]; then
            echo "배포 전 정상 응답 ${ok}건 확인 — 재배포를 진행합니다."
            tail -3 "${LOGDIR}/monitor.out"
          elif [ "$running" -eq 1 ]; then
            echo "::error::컨테이너가 떠 있는데 60초 안에 정상 응답을 받지 못했습니다. 배포를 중단합니다."
            tail -20 "${LOGDIR}/monitor.out"
            exit 1
          else
            echo "::warning::실행 중인 컨테이너가 없어 배포 전 응답을 확인할 수 없습니다 (첫 배포). 그대로 진행합니다."
          fi

      # pull 은 서비스를 건드리지 않으므로 아직 before 구간이다.
      - name: 이미지 내려받기
        run: |
          set -euo pipefail
          IMAGE='${{ steps.target.outputs.image }}'
          LATEST='${{ steps.target.outputs.repo }}:latest'
          if docker pull --platform "${PLATFORM}" "$IMAGE"; then
            echo "내려받음: $IMAGE"
          else
            echo "::warning::${IMAGE} 를 내려받지 못했습니다. ${LATEST} 로 대체합니다."
            docker pull --platform "${PLATFORM}" "$LATEST"
            echo "IMAGE_OVERRIDE=$LATEST" >> "$GITHUB_ENV"
          fi

      # ─────────── 여기서부터 실제 서비스 변경 (blue-green) ───────────
      # 8000 번은 nginx 리버스 프록시가 계속 잡고 있고, 그 뒤에서 신·구 컨테이너를
      # 겹쳐 띄운 뒤 upstream 만 바꿔치운다. nginx -s reload 는 기존 워커가 처리 중인
      # 요청을 끝까지 보내고 교체되므로 연결이 끊기지 않는다.
      - name: 새 색(color) 컨테이너 기동
        run: |
          set -euo pipefail
          printf 'during' > "${LOGDIR}/phase"
          IMAGE="${IMAGE_OVERRIDE:-${{ steps.target.outputs.image }}}"
          TAG="${IMAGE##*:}"
          echo "IMAGE_DEPLOYED=$IMAGE" >> "$GITHUB_ENV"

          docker network inspect "${DOCKER_NET}" >/dev/null 2>&1 || docker network create "${DOCKER_NET}"

          active=""
          docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}-blue"  && active=blue  || true
          docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}-green" && active=green || true
          if [ "$active" = "blue" ]; then target=green; else target=blue; fi
          echo "현재 활성: ${active:-(없음)} → 새로 띄울 색: ${target}"
          echo "ACTIVE_COLOR=${active}" >> "$GITHUB_ENV"
          echo "TARGET_COLOR=${target}" >> "$GITHUB_ENV"
          echo "ACTIVE_CONTAINER=${CONTAINER_NAME}-${target}" >> "$GITHUB_ENV"

          # 새 색은 호스트 포트를 쓰지 않는다. 기존 색이 계속 서비스하는 동안 같이 떠 있는다.
          docker rm -f "${CONTAINER_NAME}-${target}" 2>/dev/null || true
          docker run -d \
            --name "${CONTAINER_NAME}-${target}" \
            --network "${DOCKER_NET}" \
            --platform "${PLATFORM}" \
            --restart unless-stopped \
            -e "IMAGE_TAG=${TAG}" \
            "$IMAGE"

          echo "::group::새 컨테이너 내부 헬스 대기 (호스트 노출 없이 docker exec 로 확인)"
          deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SEC ))
          ready=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! docker ps -q --filter "name=${CONTAINER_NAME}-${target}" --filter "status=running" | grep -q .; then
              echo "::error::새 컨테이너가 종료되었습니다."; break
            fi
            if docker exec "${CONTAINER_NAME}-${target}" \
                 curl -fsS http://127.0.0.1:8000/api/health 2>/dev/null | grep -q '"ready": *true'; then
              ready=1; break
            fi
            sleep 3
          done
          echo "::endgroup::"
          [ "$ready" -eq 1 ] || { echo "::error::새 컨테이너가 준비되지 않았습니다."; docker logs --tail 100 "${CONTAINER_NAME}-${target}"; exit 1; }
          echo "새 컨테이너 준비 완료 — 아직 트래픽은 받지 않습니다."

      - name: 프록시 전환 (무중단)
        run: |
          set -euo pipefail
          PROXY_DIR="$HOME/.catbreed-deploy"
          mkdir -p "$PROXY_DIR"
          echo "PROXY_DIR=$PROXY_DIR" >> "$GITHUB_ENV"

          # 이전 설정을 보관해 두면 롤백 때 그대로 되돌릴 수 있다.
          [ -f "$PROXY_DIR/nginx.conf" ] && cp "$PROXY_DIR/nginx.conf" "$PROXY_DIR/nginx.conf.prev" || true

          cat > "$PROXY_DIR/nginx.conf" <<EOF
          events { worker_connections 1024; }
          http {
            access_log off;
            upstream app_upstream { server ${CONTAINER_NAME}-${TARGET_COLOR}:8000; }
            server {
              listen 8000;
              client_max_body_size 20m;
              proxy_connect_timeout 5s;
              proxy_send_timeout 120s;
              proxy_read_timeout 120s;
              location / {
                proxy_pass http://app_upstream;
                proxy_set_header Host \$host;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              }
            }
          }
          EOF
          sed -i '' 's/^          //' "$PROXY_DIR/nginx.conf" 2>/dev/null || sed -i 's/^          //' "$PROXY_DIR/nginx.conf"

          if docker ps --format '{{.Names}}' | grep -qx "${PROXY_NAME}"; then
            # 평상시 경로: 설정만 바꾸고 graceful reload. 연결이 끊기지 않는다.
            docker exec "${PROXY_NAME}" nginx -t
            docker exec "${PROXY_NAME}" nginx -s reload
            echo "프록시 upstream 전환: → ${CONTAINER_NAME}-${TARGET_COLOR} (graceful reload)"
          else
            # 최초 1회: 8000 을 쓰던 단일 컨테이너를 내리고 프록시를 올린다.
            # 이 전환에서만 공백이 생기고, 이후 배포부터는 무중단이다.
            echo "::warning::프록시가 없어 최초 구성을 수행합니다. 이번 전환에서만 짧은 공백이 생깁니다."
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
            others="$(docker ps -q --filter "publish=${HOST_PORT}")"
            [ -n "$others" ] && docker rm -f $others || true
            docker run -d \
              --name "${PROXY_NAME}" \
              --network "${DOCKER_NET}" \
              --restart unless-stopped \
              -p "${HOST_PORT}:8000" \
              -v "$PROXY_DIR/nginx.conf:/etc/nginx/nginx.conf:ro" \
              nginx:1.27-alpine
          fi

          for i in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${HOST_PORT}/api/health" >/dev/null 2>&1 && break
            sleep 1
          done
          docker ps --filter "name=cat-breed" --format '{{.Names}}  {{.Image}}  {{.Status}}  {{.Ports}}'

      - name: 서비스 검증 (프록시 경유)
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:${HOST_PORT}"
          echo "::group::서비스 응답 검증"
          curl -fsS "${BASE}/api/health" | grep -q '"ready": *true' || { echo "::error::헬스 실패"; exit 1; }
          count=$(curl -fsS "${BASE}/api/breeds" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          [ "$count" = "48" ] || { echo "::error::라벨 수가 48이 아닙니다: $count"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/")
          [ "$code" = "200" ] || { echo "::error::UI 기대 200, 실제 $code"; exit 1; }
          echo "라벨 48종 / UI 200 확인"
          curl -fsS "${BASE}/api/health" | /usr/bin/python3 -c \
            'import json,sys; d=json.load(sys.stdin); print("프록시 뒤 배포 버전:", d.get("version"))'
          echo "컨테이너 아키텍처: $(docker exec "${ACTIVE_CONTAINER}" uname -m) / 사용자: $(docker exec "${ACTIVE_CONTAINER}" id -un)"
          echo "::endgroup::"

      - name: 이전 색 정리
        run: |
          set -euo pipefail
          if [ -n "${ACTIVE_COLOR}" ] && [ "${ACTIVE_COLOR}" != "${TARGET_COLOR}" ]; then
            # reload 직후 기존 워커가 처리 중인 요청을 끝낼 시간을 준다.
            sleep 5
            docker rm -f "${CONTAINER_NAME}-${ACTIVE_COLOR}" 2>/dev/null || true
            echo "이전 색 제거: ${CONTAINER_NAME}-${ACTIVE_COLOR}"
          else
            echo "제거할 이전 색이 없습니다."
          fi

      - name: 배포 완료 후 관측 유지
        run: |
          set -euo pipefail
          printf 'after' > "${LOGDIR}/phase"
          echo "배포 완료. ${POST_DEPLOY_WATCH_SEC}초 동안 관측을 유지합니다."
          sleep "${POST_DEPLOY_WATCH_SEC}"

      - name: 실패 시 로그 수집 및 롤백
        if: failure() && env.IMAGE_DEPLOYED != ''
        run: |
          set +e
          printf 'rollback' > "${LOGDIR}/phase"
          echo "::group::새 컨테이너 로그 (마지막 200줄)"
          docker logs --tail 200 "${CONTAINER_NAME}-${TARGET_COLOR}" 2>&1
          echo "::endgroup::"
          docker inspect -f 'State={{.State.Status}} ExitCode={{.State.ExitCode}}' "${CONTAINER_NAME}-${TARGET_COLOR}" 2>&1

          if [ -n "${ACTIVE_COLOR}" ] && docker ps -q --filter "name=${CONTAINER_NAME}-${ACTIVE_COLOR}" | grep -q .; then
            echo "이전 색(${ACTIVE_COLOR})이 살아 있습니다. 프록시를 되돌립니다."
            if [ -f "${PROXY_DIR}/nginx.conf.prev" ]; then
              cp "${PROXY_DIR}/nginx.conf.prev" "${PROXY_DIR}/nginx.conf"
              docker exec "${PROXY_NAME}" nginx -s reload
            fi
            docker rm -f "${CONTAINER_NAME}-${TARGET_COLOR}"
            echo "롤백 완료 — ${CONTAINER_NAME}-${ACTIVE_COLOR} 가 계속 서비스합니다."
          else
            echo "되돌릴 이전 색이 없습니다. 실패한 컨테이너를 정리합니다."
            docker rm -f "${CONTAINER_NAME}-${TARGET_COLOR}"
          fi
          sleep "${POST_DEPLOY_WATCH_SEC}"

      # ─────────── 배포 성공/실패와 무관하게 로그와 요약을 남긴다 ───────────
      - name: 모니터링 종료
        if: always()
        run: |
          set +e
          [ -d "${LOGDIR}" ] || exit 0
          touch "${LOGDIR}/stop"
          for i in $(seq 1 20); do
            pid=$(cat "${LOGDIR}/monitor.pid" 2>/dev/null)
            [ -n "$pid" ] || break
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          pid=$(cat "${LOGDIR}/monitor.pid" 2>/dev/null)
          if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
            echo "::warning::모니터가 스스로 종료하지 않아 강제 종료합니다."
            kill "$pid" 2>/dev/null
          fi
          echo "기록된 요청 수: $(grep -c '"type": "request"' "${LOGDIR}/monitor.jsonl" 2>/dev/null || echo 0)"

      - name: 요청 결과 출력 및 Summary 작성
        if: always()
        run: |
          set +e
          [ -f "${LOGDIR}/monitor.jsonl" ] || { echo "모니터 로그가 없습니다."; exit 0; }
          TAG="${IMAGE_DEPLOYED##*:}"
          /usr/bin/python3 scripts/deploy_summary.py \
            --log "${LOGDIR}/monitor.jsonl" \
            --summary-out "${LOGDIR}/summary.md" \
            --url "http://127.0.0.1:${HOST_PORT}" \
            --image-tag "${TAG:-(교체 전 실패)}" \
            --deploy-result "${{ job.status }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "서비스 http://localhost:${HOST_PORT} · [Actions 실행 #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"

      - name: 검증 로그 업로드 (UTF-8)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verification-${{ github.run_number }}
          path: |
            monitor-logs/monitor.jsonl
            monitor-logs/monitor.out
            monitor-logs/summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: 사용하지 않는 이미지 정리
        if: success()
        run: |
          set -euo pipefail
          repo='${{ steps.target.outputs.repo }}'
          dangling="$(docker images "$repo" --filter dangling=true -q | sort -u)"
          if [ -n "$dangling" ]; then
            echo "태그 없는 이전 이미지 정리: $dangling"
            docker rmi $dangling || true
          fi
          docker images "$repo" --format '{{.Repository}}:{{.Tag}}  {{.Size}}' || true
