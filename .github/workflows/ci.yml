name: CI

# main 에 push 하면 이미지를 빌드·검증한 뒤 Docker Hub 로 업로드한다.
# Pull Request 에서는 빌드와 검증만 하고 업로드하지 않는다.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify-push:
    name: 빌드 · 검증 · 업로드
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 빌드 조건 결정
        id: cfg
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "repo=${DOCKERHUB_USERNAME}/cat-breed-estimator" >> "$GITHUB_OUTPUT"
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
          else
            # 포크 PR 등 시크릿을 쓸 수 없는 경우에도 빌드·검증은 수행한다.
            echo "repo=local/cat-breed-estimator" >> "$GITHUB_OUTPUT"
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME 시크릿이 없어 업로드를 건너뜁니다."
          fi
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 디스크 여유 공간 확보
        run: |
          # torch(210MB) + 모델(341MB) + 이미지(약 1.9GB) 를 위해 러너의 불필요한 SDK 를 정리한다.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        if: steps.cfg.outputs.have_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 태그 메타데이터 생성
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cfg.outputs.repo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      # ── 1단계: 검증용으로 로컬에 이미지를 적재한다 ──
      # Dockerfile 안에서 의존성 버전 검증과 모델 로드 검증(순전파 1회)이 수행되므로,
      # 이 단계가 성공했다는 것은 모델이 정상적으로 포함·로드되었다는 뜻이다.
      - name: 이미지 빌드 (검증용, linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ci-verify:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 컨테이너 스모크 테스트
        run: |
          set -euo pipefail
          IMAGE="ci-verify:${{ github.sha }}"

          echo "::group::컨테이너 기동"
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health 2>/dev/null | grep -q '"ready":true'; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::컨테이너가 준비되지 않았습니다."
            docker logs smoke
            exit 1
          fi
          echo "health OK"
          echo "::endgroup::"

          echo "::group::비root 실행 확인"
          user=$(docker exec smoke id -un)
          echo "실행 사용자: $user"
          [ "$user" = "appuser" ] || { echo "::error::root 로 실행되고 있습니다."; exit 1; }
          echo "::endgroup::"

          echo "::group::라벨 수 확인"
          count=$(curl -fsS http://127.0.0.1:8000/api/breeds | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"])')
          echo "라벨 수: $count"
          [ "$count" = "48" ] || { echo "::error::라벨 수가 48이 아닙니다: $count"; exit 1; }
          echo "::endgroup::"

          echo "::group::추론 경로 확인"
          # 외부 의존 없이 테스트용 PNG 를 생성한다 (표준 라이브러리만 사용).
          python3 - <<'PY'
          import struct, zlib
          w = h = 224
          row = b'\x00' + b''.join(bytes([(x * 255) // w, 128, 200]) for x in range(w))
          raw = row * h
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw, 9))
                 + chunk(b'IEND', b''))
          open('probe.png', 'wb').write(png)
          print('테스트 이미지 생성:', len(png), 'bytes')
          PY
          body=$(curl -fsS -X POST -F "file=@probe.png" http://127.0.0.1:8000/api/analyze)
          echo "$body" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["is_estimate"] is True, d
          assert d["status"] in ("ok", "no_cat", "wild_cat"), d["status"]
          assert len(d["predictions"]) == 5, d["predictions"]
          assert d["model"]["device"] == "cpu", d["model"]
          print("추론 응답 정상 — status:", d["status"], "| 소요:", d["elapsed_ms"], "ms")
          '
          echo "::endgroup::"

          echo "::group::오류 처리 확인"
          printf 'not an image' > bad.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -F "file=@bad.txt" http://127.0.0.1:8000/api/analyze)
          [ "$code" = "415" ] || { echo "::error::비이미지 기대 415, 실제 $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/analyze)
          [ "$code" = "400" ] || { echo "::error::파일없음 기대 400, 실제 $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$code" = "200" ] || { echo "::error::UI 기대 200, 실제 $code"; exit 1; }
          echo "오류 처리 415/400 및 UI 200 확인"
          echo "::endgroup::"

      - name: 컨테이너 로그 (실패 시)
        if: failure()
        run: docker logs smoke || true

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f smoke || true

      # ── 2단계: 검증을 통과한 경우에만 업로드 ──
      # 위 빌드의 캐시를 재사용하므로 다시 빌드하지 않는다.
      - name: Docker Hub 업로드
        if: steps.cfg.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false

      - name: 업로드 결과 요약
        if: steps.cfg.outputs.push == 'true'
        run: |
          {
            echo "### Docker Hub 업로드 완료"
            echo ""
            echo "업로드된 태그:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "실행: \`docker run --rm -p 8000:8000 ${{ steps.cfg.outputs.repo }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
