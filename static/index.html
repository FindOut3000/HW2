<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고양이 품종 추정기</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
  <header class="head">
    <h1>🐱 고양이 품종 추정기</h1>
    <p class="sub">사진을 올리면 로컬 CPU에서 동작하는 AI 모델이 가장 가까운 품종을 추정합니다.</p>
    <p class="status" id="status" role="status">모델 상태 확인 중…</p>
  </header>

  <section class="notice" role="note">
    <strong>결과는 추정치입니다.</strong>
    이 앱의 출력은 AI 모델이 계산한 확률일 뿐이며 품종을 확정하지 않습니다.
    정확한 품종은 수의사 진료나 혈통서로만 확인할 수 있습니다.
  </section>

  <section class="card">
    <div id="drop" class="drop" tabindex="0" role="button"
         aria-label="이미지 파일 선택 또는 끌어다 놓기">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="drop-inner">
        <div class="drop-icon">📁</div>
        <p class="drop-main">이미지를 끌어다 놓거나 클릭해서 선택</p>
        <p class="drop-sub" id="dropSub">JPG · PNG · WEBP · BMP · GIF · TIFF / 최대 10MB</p>
      </div>
    </div>

    <div id="previewBox" class="preview-box" hidden>
      <img id="preview" class="preview" alt="업로드한 이미지 미리보기">
      <dl class="meta" id="fileMeta"></dl>
    </div>

    <div class="actions">
      <button id="analyzeBtn" class="btn primary" disabled>분석하기</button>
      <button id="resetBtn" class="btn ghost" disabled>초기화</button>
    </div>
  </section>

  <section id="error" class="error" hidden role="alert"></section>

  <section id="result" class="card result" hidden>
    <div class="verdict">
      <span id="badge" class="badge">추정</span>
      <h2 id="topBreed">—</h2>
      <p id="topBreedEn" class="top-en"></p>
      <p id="message" class="message"></p>
    </div>

    <h3 class="section-title">상위 후보 (확률순)</h3>
    <p id="barsNote" class="bars-note" hidden></p>
    <ul id="bars" class="bars"></ul>

    <details class="details">
      <summary>분석 상세 정보</summary>
      <dl class="meta" id="detailMeta"></dl>
    </details>

    <p class="disclaimer" id="disclaimer"></p>
  </section>

  <footer class="foot">
    <span id="modelInfo">모델 정보 로딩 중…</span>
  </footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
